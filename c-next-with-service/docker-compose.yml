services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kicau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kicau}
      POSTGRES_DB: ${POSTGRES_DB:-kicau}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-kicau} -d ${POSTGRES_DB:-kicau}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kicau}:${POSTGRES_PASSWORD:-kicau}@db:5432/${POSTGRES_DB:-kicau}
      SEED_DEMO: ${SEED_DEMO:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres_data:
